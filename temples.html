<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album | WDD 131</title>
    <meta name="description" content="Responsive temple album page with a hamburger menu and dynamic footer information.">
    <meta name="author" content="Pablo Nicolas Chumba Perez">
    <link rel="preconnect" href="https://fonts.googleapis.com">
